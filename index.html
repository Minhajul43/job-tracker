<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CareerTrack - Job Application Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <header>
    <h1>CareerTrack Dashboard</h1>
  </header>

  <section class="dashboard">
    <div class="card">
      <h3>Total Jobs</h3>
      <p id="totalCount">0</p>
    </div>
    <div class="card">
      <h3>Interview</h3>
      <p id="interviewCount">0</p>
    </div>
    <div class="card">
      <h3>Rejected</h3>
      <p id="rejectedCount">0</p>
    </div>
  </section>

  <section class="jobs-section">
    <div class="jobs-header">
      <h2>Available Jobs</h2>
      <span id="tabCount">0 Jobs</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="interview">Interview</button>
      <button class="tab" data-tab="rejected">Rejected</button>
    </div>

    <div id="jobsContainer" class="jobs-container"></div>

    <div id="emptyState" class="empty hidden">
      <img src="https://cdn-icons-png.flaticon.com/512/4076/4076505.png" width="80">
      <h3>No Jobs Available</h3>
      <p>No job is currently in this category.</p>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>

</html>
