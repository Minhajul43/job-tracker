<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Job Application Tracker</title>

  <link rel="stylesheet" href="styles/style.css">

</head>

<body>

  <header>
    <h1>Job Application Tracker</h1>
  </header>

  <!-- Dashboard -->

  <section class="dashboard">

    <div class="dashboard-card">
      <h3>Total Jobs</h3>
      <p id="totalCount">0</p>
    </div>

    <div class="dashboard-card">
      <h3>Interview</h3>
      <p id="interviewCount">0</p>
    </div>

    <div class="dashboard-card">
      <h3>Rejected</h3>
      <p id="rejectedCount">0</p>
    </div>

  </section>

  <!-- Jobs Section -->

  <section class="jobs-section">

    <div class="jobs-header">
      <h2>Available Jobs</h2>
      <span id="tabCount">0 Jobs</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="interview">Interview</button>
      <button class="tab" data-tab="rejected">Rejected</button>
    </div>

    <div id="jobsContainer" class="jobs-container"></div>

    <div id="emptyState" class="empty hidden">
      <img src="image/image1.png" width="80">
      <h3>No Jobs Available</h3>
      <p>Check back soon for new job opportunities!</p>
    </div>

  </section>

  <script src="js/script.js"></script>

</body>

</html>
